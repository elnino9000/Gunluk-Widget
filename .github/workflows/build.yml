name: APK derle

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı hazırla
        run: cp app/build/outputs/apk/debug/app-debug.apk gunluk-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gunluk-widget
          path: gunluk-widget.apk

      - name: Release olarak yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum gunluk-widget.apk \
            --title "Günlük Widget (son sürüm)" \
            --notes "Telefondan indirip kur: gunluk-widget.apk"
